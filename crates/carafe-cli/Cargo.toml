[package]
name = "carafe-cli"
description = "carafe — запускатель Windows-игр из Steam на macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "carafe"
path = "src/main.rs"

[dependencies]
carafe-core.workspace = true
# QR для `carafe login` прямо в терминале; без image/svg — только текстовый рендер.
qrcode = { version = "0.14", default-features = false }
serde_json = "1"

[lints]
workspace = true
