name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # carafe — только для macOS: ядро зовёт xattr и rsync, пути — как у Steam для Mac.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Версия и компоненты — из rust-toolchain.toml; rustup на раннере уже есть.
      - name: toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        run: cargo test --locked
