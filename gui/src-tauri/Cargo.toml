[package]
name = "carafe-gui"
version = "0.1.0"
edition = "2024"
description = "GUI для carafe: Windows-игры из Steam на macOS"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
carafe-core = { path = "../../crates/carafe-core" }
tauri = { version = "2.12", features = [] }
# Системный диалог выбора папки библиотеки; зовётся из Rust, JS-доступа (capabilities) не нужно.
tauri-plugin-dialog = "2.8.3"
# QR входа в Steam рисуется в Rust в SVG: строгий CSP, без JS-библиотек и CDN.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
